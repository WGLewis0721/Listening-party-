<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>Door check-in · Listening Room</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/lr.css">
<style>
body{background:var(--bg)}
.dw{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:baseline;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.dh h1{margin:0;font:400 clamp(1.8rem,4vw,2.8rem)/1 var(--display)}
.cnt{font:700 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.cnt b{color:var(--ink);font-size:1.2rem;letter-spacing:.02em}
.box{margin-top:18px;padding:clamp(16px,2.4vw,24px);border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.fld{flex:1 1 300px;display:grid;gap:8px}.fld label{font:600 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fld input{width:100%;min-height:56px;padding:0 16px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--ink);font:600 16px/1.2 var(--mono);box-shadow:inset 0 0 0 1px var(--line-strong)}
.fld input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
#res{margin-top:18px;min-height:150px;display:grid;align-content:center;gap:6px;padding:24px;border-radius:20px;text-align:left;box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.03)}
#res h2{margin:0;font:800 clamp(2rem,6vw,3.6rem)/1 var(--body);letter-spacing:-.02em}
#res p{margin:0;font-size:1.05rem;color:var(--muted)}
#res.ok{background:#0e3a22;box-shadow:inset 0 0 0 2px #3ddc84}#res.ok h2{color:#7dffb0}
#res.warn{background:#3d2e08;box-shadow:inset 0 0 0 2px #ffd34d}#res.warn h2{color:#ffd34d}
#res.bad{background:#3b1010;box-shadow:inset 0 0 0 2px #ff6b6b}#res.bad h2{color:#ff9a9a}
table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font:700 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.in{color:#7dffb0;font-weight:700}.out{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin:12px 0 0}
</style>
</head>
<body>
<div class="lr" id="lr"><noscript><p style="padding:40px">The door tool needs JavaScript.</p></noscript></div>
<script src="edition.js"></script>
<script src="assets/js/lr-ticket.js"></script>
<script src="assets/js/lr-core.js"></script>
<script src="assets/js/lr-api-mock.js"></script>
<script src="assets/js/lr-api-live.js"></script>
<script src="assets/js/lr-demo-clock.js"></script>
<script src="assets/js/lr-door.js"></script>
</body>
</html>
