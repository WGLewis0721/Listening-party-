<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>Door · Listening Room</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/lr.css">
<style>
body{background:var(--bg)}
.dw{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left))}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 16px}
.dh p{margin:0}.cnt{font:700 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dh h1{margin:4px 0 0;font:400 clamp(1.7rem,6vw,2.4rem)/1 var(--display)}
.count{text-align:right;font:600 .95rem/1.2 var(--body);color:var(--muted)}.count b{display:block;font:800 clamp(2.6rem,12vw,3.6rem)/1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.scan{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:112px;border:0;border-radius:28px;background:var(--acc);color:var(--acc-on);font:800 clamp(1.6rem,7vw,2.1rem)/1 var(--body);cursor:pointer;box-shadow:0 16px 50px -16px color-mix(in srgb,var(--acc) 80%,transparent);touch-action:manipulation}
.scan svg{width:34px;height:34px}
.find{margin-top:26px;display:grid;gap:10px}
.find label{font:600 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.find input{width:100%;min-height:60px;padding:0 18px;border:0;border-radius:16px;background:rgba(255,255,255,.07);color:var(--ink);font:600 18px/1.2 var(--body);box-shadow:inset 0 0 0 1px var(--line-strong)}
.find input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.gl-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.gl-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:8px 8px 8px 16px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.gl-list b{display:block;font:700 1.1rem/1.2 var(--body)}.gl-list small{color:var(--muted);font-size:.9rem}
.gl-list .go{min-width:104px;min-height:52px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:700 1rem/1 var(--body);box-shadow:inset 0 0 0 1.5px var(--line-strong);cursor:pointer}
.gl-list .in{min-width:104px;text-align:center;color:#7dffb0;font-weight:700;padding-right:8px}
.empty{color:var(--muted);padding:14px 4px}
.demo{margin-top:28px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
.demo summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font:600 .9rem var(--body)}
.demo .row{display:grid;gap:10px;padding:8px 0}
.setup{margin:18px 0;padding:20px;border-radius:18px;background:#3d2e08;box-shadow:inset 0 0 0 2px #ffd34d}.setup h2{margin:0 0 6px;font:800 1.4rem/1.2 var(--body);color:#ffd34d}.setup p{margin:0;color:var(--ink)}
/* camera */
.cam{position:fixed;inset:0;z-index:60;background:#000;display:grid}
.cam[hidden],.ov[hidden]{display:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .reticle{position:absolute;left:50%;top:42%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28px;box-shadow:0 0 0 9999px rgba(0,0,0,.45),inset 0 0 0 4px #fff}
.cam .hint{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));margin:0;text-align:center;color:#fff;font:700 1.15rem/1.3 var(--body);text-shadow:0 2px 12px #000;padding:0 24px}
.cam .done{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));min-height:64px;border:0;border-radius:999px;background:#fff;color:#000;font:800 1.2rem/1 var(--body);cursor:pointer}
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;text-align:center}
.ov.ok{background:#0e3a22;color:#7dffb0}.ov.warn{background:#3d2e08;color:#ffd34d}.ov.bad{background:#3b1010;color:#ff9a9a}.ov.ask{background:#16161a;color:#fff}
.ov-in{max-width:520px;width:100%;display:grid;gap:14px;justify-items:center}
.ov-k{margin:0;font:800 clamp(1.2rem,5vw,1.6rem)/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.ov h2{margin:0;font:800 clamp(2.4rem,11vw,4.2rem)/1.05 var(--body);letter-spacing:-.02em;overflow-wrap:anywhere}
.ov p{margin:0;font:600 clamp(1.1rem,4.4vw,1.4rem)/1.35 var(--body);color:#fff}
.ov-b{display:grid;gap:12px;width:100%;margin-top:10px}
.ov-b button{min-height:68px;border:0;border-radius:999px;font:800 1.2rem/1 var(--body);cursor:pointer;background:#fff;color:#000}
.ov-b button.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
</style>
</head>
<body>
<div class="lr" id="lr"><noscript><p style="padding:40px">This page needs JavaScript.</p></noscript></div>
<script src="edition.js"></script>
<script src="assets/js/lr-ticket.js"></script>
<script src="assets/js/lr-core.js"></script>
<script src="assets/js/lr-api-mock.js"></script>
<script src="assets/js/lr-api-live.js"></script>
<script src="assets/js/lr-demo-clock.js"></script>
<script src="assets/js/vendor/jsQR.js"></script>
<script src="assets/js/lr-door.js"></script>
</body>
</html>
